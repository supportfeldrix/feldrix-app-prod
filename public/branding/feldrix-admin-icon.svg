<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Dark charcoal rounded-square background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="#1E293B"/>

  <!-- Subtle radial glow -->
  <circle cx="512" cy="420" r="320" fill="url(#adminGlow)" opacity="0.4"/>
  <defs>
    <radialGradient id="adminGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Outer circular frame -->
  <circle cx="512" cy="420" r="260" fill="none" stroke="#334155" stroke-width="4"/>
  <circle cx="512" cy="420" r="240" fill="none" stroke="#475569" stroke-width="2" opacity="0.5"/>

  <!-- Gear element - behind the bars -->
  <g transform="translate(512, 420)">
    <!-- Gear body -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#gearGrad)" stroke-width="18" opacity="0.3"/>
    <!-- Gear teeth -->
    <g opacity="0.4">
      <rect x="-12" y="-195" width="24" height="35" rx="6" fill="#64748B"/>
      <rect x="-12" y="160" width="24" height="35" rx="6" fill="#64748B"/>
      <rect x="-195" y="-12" width="35" height="24" rx="6" fill="#64748B"/>
      <rect x="160" y="-12" width="35" height="24" rx="6" fill="#64748B"/>
      <!-- Diagonal teeth -->
      <rect x="115" y="-145" width="24" height="35" rx="6" fill="#64748B" transform="rotate(45 127 -127)"/>
      <rect x="-139" y="-145" width="24" height="35" rx="6" fill="#64748B" transform="rotate(-45 -127 -127)"/>
      <rect x="115" y="110" width="24" height="35" rx="6" fill="#64748B" transform="rotate(-45 127 127)"/>
      <rect x="-139" y="110" width="24" height="35" rx="6" fill="#64748B" transform="rotate(45 -127 127)"/>
    </g>
    <!-- Gear inner circle -->
    <circle cx="0" cy="0" r="70" fill="#1E293B" stroke="#475569" stroke-width="3"/>
  </g>

  <!-- Analytics bars - centre of gear -->
  <g transform="translate(512, 420)">
    <!-- Bar 1 (shortest) -->
    <rect x="-60" y="10" width="28" height="55" rx="6" fill="url(#barGrad)" opacity="0.7"/>
    <!-- Bar 2 (medium) -->
    <rect x="-18" y="-20" width="28" height="85" rx="6" fill="url(#barGrad)" opacity="0.85"/>
    <!-- Bar 3 (tallest) -->
    <rect x="24" y="-50" width="28" height="115" rx="6" fill="url(#barGrad)"/>
    <!-- Trend line -->
    <path d="M-46 5 L-4 -25 L38 -55" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <!-- Trend dot -->
    <circle cx="38" cy="-55" r="5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Leaf element - top right of gear -->
  <g transform="translate(640, 270) rotate(20)">
    <path d="M0 40 Q20 0 40 40 Q20 25 0 40 Z" fill="#06B6D4" opacity="0.9"/>
    <line x1="20" y1="40" x2="20" y2="15" stroke="#0891B2" stroke-width="2.5"/>
    <!-- Leaf veins -->
    <path d="M20 25 L12 18" fill="none" stroke="#0891B2" stroke-width="1.5" opacity="0.6"/>
    <path d="M20 30 L28 23" fill="none" stroke="#0891B2" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Small accent leaf - bottom left -->
  <g transform="translate(350, 560) rotate(-10) scale(0.7)">
    <path d="M0 40 Q20 0 40 40 Q20 25 0 40 Z" fill="#06B6D4" opacity="0.5"/>
    <line x1="20" y1="40" x2="20" y2="15" stroke="#0891B2" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- FELDRIX text -->
  <text x="512" y="740" text-anchor="middle" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="120" font-weight="900" fill="#ffffff" letter-spacing="-1">FELDRIX</text>

  <!-- CONTROL CENTRE text -->
  <text x="512" y="820" text-anchor="middle" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="52" font-weight="600" fill="#06B6D4" letter-spacing="6">CONTROL CENTRE</text>

  <!-- Subtle bottom accent line -->
  <rect x="362" y="850" width="300" height="3" rx="1.5" fill="#06B6D4" opacity="0.4"/>
</svg>
